plugins { id 'com.android.application' }
android {
    namespace 'app.sunward'
    compileSdk 36
    buildToolsVersion "36.0.0"
    defaultConfig { applicationId 'app.sunward'; minSdk 26; targetSdk 36; versionCode 4; versionName '1.3' }
    def existingSigningKey = System.getenv('SUNWARD_KEYSTORE')
    if (existingSigningKey) {
        signingConfigs {
            debug {
                storeFile file(existingSigningKey)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
